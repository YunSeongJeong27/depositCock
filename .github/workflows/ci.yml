# CI (2026-11-18): PR 을 올리거나 dev·main 에 push 되면 GitHub 서버에서 자동으로 테스트한다.
# 결과는 PR 화면에 ✅/❌ 로 표시된다. 배포(CD)는 배포처가 정해지면 따로 추가한다 (docs/design.md "작업 흐름").
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: ./mvnw test
        working-directory: backend
        run: ./mvnw -B test

  frontend:
    name: 프론트 타입 검사·빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: npm run typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: npm run build
        working-directory: frontend
        run: npm run build
